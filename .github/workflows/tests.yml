name: Card Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  card-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax and regression tests
        run: |
          node --check sirgon-globe.js
          node --test tests/temperature.test.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Render cards and exercise editor and forecast dialog
        run: node tests/browser-smoke.cjs
