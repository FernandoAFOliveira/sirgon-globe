name: Card Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  card-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax and regression tests
        run: |
          node --check sirgon-globe.js
          node --test tests/temperature.test.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Render cards and exercise editor and forecast dialog
        run: node tests/browser-smoke.cjs

  hacs-release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, '[release v1.2.0]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate HACS release
        uses: hacs/action@main
        with:
          category: plugin

  release-1-2-0:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, '[release v1.2.0]') }}
    needs: [card-tests, hacs-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Publish v1.2.0 with release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.2.0
        shell: bash
        run: |
          set -euo pipefail
          grep -qFx "// Sirgon Globe $TAG" sirgon-globe.js
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to overwrite."
            exit 1
          fi
          gh release create "$TAG" sirgon-globe.js hacs.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Sirgon Globe $TAG" --notes-file docs/releases/v1.2.0.md
