name: "Publish Release"

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Inject version tag into code
        shell: bash
        run: |
          TAG_VERSION="${{ github.event.release.tag_name }}"

          sed -i -E \
            "s#^(// Sirgon Globe )v[0-9]+\.[0-9]+\.[0-9]+.*#\1${TAG_VERSION}#" \
            sirgon-globe.js

          grep -qF "// Sirgon Globe ${TAG_VERSION}" sirgon-globe.js

      - name: Upload release files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sirgon-globe.js
            hacs.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
